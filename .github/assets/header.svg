<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#020409"/>
    <stop offset="0.45" stop-color="#061B2B"/>
    <stop offset="0.72" stop-color="#15103A"/>
    <stop offset="1" stop-color="#03040A"/>
  </linearGradient>

  <radialGradient id="cyanGlow" cx="0" cy="0" r="1"
    gradientUnits="userSpaceOnUse"
    gradientTransform="translate(180 80) rotate(35) scale(500 350)">
    <stop stop-color="#00F7FF" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#00F7FF" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="purpleGlow" cx="0" cy="0" r="1"
    gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1050 280) rotate(-25) scale(500 350)">
    <stop stop-color="#8A2BE2" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#00F7FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00F7FF"/>
    <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="360" rx="18" fill="url(#background)"/>

<!-- GLOWS -->

<rect width="1200" height="360" fill="url(#cyanGlow)"/>
<rect width="1200" height="360" fill="url(#purpleGlow)"/>

<!-- GRID -->

<g opacity="0.10" stroke="#00F7FF" stroke-width="1">

  <path d="M0 60H1200"/>
  <path d="M0 120H1200"/>
  <path d="M0 180H1200"/>
  <path d="M0 240H1200"/>
  <path d="M0 300H1200"/>

  <path d="M100 0V360"/>
  <path d="M200 0V360"/>
  <path d="M300 0V360"/>
  <path d="M400 0V360"/>
  <path d="M500 0V360"/>
  <path d="M600 0V360"/>
  <path d="M700 0V360"/>
  <path d="M800 0V360"/>
  <path d="M900 0V360"/>
  <path d="M1000 0V360"/>
  <path d="M1100 0V360"/>

</g>

<!-- TOP HUD -->

<g font-family="monospace" font-size="12" fill="#00F7FF">

  <text x="40" y="35">
    SYSTEM // FUTURE_AI
  </text>

  <text x="1030" y="35">
    STATUS: ONLINE
  </text>

</g>

<!-- CORNER DETAILS -->

<path d="M40 55H170" stroke="#00F7FF" stroke-width="2"/>
<path d="M40 55V85" stroke="#00F7FF" stroke-width="2"/>

<path d="M1160 55H1030" stroke="#8A2BE2" stroke-width="2"/>
<path d="M1160 55V85" stroke="#8A2BE2" stroke-width="2"/>

<!-- CENTER HUD -->

<circle
  cx="600"
  cy="150"
  r="85"
  stroke="#00F7FF"
  stroke-opacity="0.12"
  stroke-width="1"/>

<circle
  cx="600"
  cy="150"
  r="70"
  stroke="#8A2BE2"
  stroke-opacity="0.12"
  stroke-width="1"/>

<circle
  cx="600"
  cy="150"
  r="5"
  fill="#00F7FF"
  filter="url(#glow)"/>

<!-- NAME -->

<text
  x="600"
  y="150"
  text-anchor="middle"
  font-family="monospace"
  font-size="48"
  font-weight="700"
  letter-spacing="5"
  fill="#FFFFFF">
  LUCAS CORTES
</text>

<!-- SUBTITLE -->

<text
  x="600"
  y="185"
  text-anchor="middle"
  font-family="monospace"
  font-size="16"
  letter-spacing="3"
  fill="#00F7FF">
  AI • IoT • AUTOMATION • SOFTWARE
</text>

<!-- STATUS -->

<rect
  x="445"
  y="215"
  width="310"
  height="32"
  rx="4"
  fill="#020409"
  fill-opacity="0.7"
  stroke="#00F7FF"
  stroke-opacity="0.6"/>

<circle cx="465" cy="231" r="5" fill="#00FF88"/>

<text
  x="480"
  y="236"
  font-family="monospace"
  font-size="13"
  fill="#FFFFFF">
  SYSTEM ONLINE // BUILDING THE FUTURE
</text>

<!-- BOTTOM HUD -->

<line
  x1="150"
  y1="285"
  x2="1050"
  y2="285"
  stroke="url(#line)"
  stroke-width="2"/>

<g font-family="monospace" font-size="11" fill="#8A2BE2">

  <text x="150" y="310">
    AI_CORE: ACTIVE
  </text>

  <text x="510" y="310">
    ORCHESTRATOR: READY
  </text>

  <text x="910" y="310">
    BUILD: 2026
  </text>

</g>

<!-- BOTTOM LINE -->

<text
  x="600"
  y="340"
  text-anchor="middle"
  font-family="monospace"
  font-size="11"
  letter-spacing="4"
  fill="#FFFFFF"
  fill-opacity="0.5">
  INITIALIZING THE FUTURE
</text>

</svg>
